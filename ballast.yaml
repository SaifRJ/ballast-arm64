# Ballast Pipeline Configuration

# What engine(s) do you want to use?
engines:
  - name: kleidiai_build
    source: https://github.com/ggml-org/llama.cpp
    tag: b10327
    cmake_flags: { GGML_NATIVE: ON, GGML_CPU_KLEIDIAI: ON }

  - name: baseline_build
    source: https://github.com/ggml-org/llama.cpp
    tag: b10327
    cmake_flags: { GGML_NATIVE: OFF, GGML_CPU_KLEIDIAI: OFF }

# What models do you want to benchmark?
# Note: if you are specifying a local file path as source, the name field MUST match the file name. 
models:
  - name: TinyLlama
    source: https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    context_size: 2048 # How many tokens to use for the context window when generating tokens
    cache_type_k: q8_0 # Specify what key quantization type to use for the model cache. Options: q4_0, q4_1, q5_0, q5_1, q8_0, f16, bf16, f32, iq4_nl
    cache_type_v: q8_0 # Specify what value quantization type to use for the model cache. Options: q4_0, q4_1, q5_0, q5_1, q8_0, f16, bf16, f32, iq4_nl
    fa: 1
    batch_size: 1024
    generated_tokens: 100 # Number of tokens to generate per measurement window
    swa_full: false

  - name: Gemma-3
    source: https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf
    context_size: 8192
    cache_type_k: q8_0
    cache_type_v: q8_0
    fa: 1
    batch_size: 2048
    generated_tokens: 100 
    swa_full: false

  - name: Qwen-3
    source: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
    context_size: 8192
    cache_type_k: q8_0
    cache_type_v: q8_0
    fa: 1
    batch_size: 2048
    generated_tokens: 100
    swa_full: false

  - name: Phi-4
    source: https://huggingface.co/bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
    context_size: 8192
    cache_type_k: q8_0 
    cache_type_v: q8_0 
    fa: 1
    batch_size: 2048
    generated_tokens: 100
    swa_full: false

# Specify a corpus, or several, to test perplexity per model. Perplexity will not be measured if this section is empty.
# Perplexity is a language-modelling metric (how well the model predicts tokens based on the content of the corpus).
corpora:
  - name: wikitext-2
    source: https://huggingface.co/datasets/ggml-org/ci/resolve/main/wikitext-2-raw-v1.zip
    chunks: 40

runtime:
  n_threads: auto # Specify how many threads to use (via os.cpu_count) at inference time. If set to auto, will use the maximum number of threads available. 
  n_threads_batch: auto # Threads for prefill/prompt processing. If set to auto, will use the same value as n_threads. Set independently for heterogeneous CPUs (P+E cores).

pipeline:
  mode: snapshot # snapshot / sampled
  task: benchmark # benchmark / optimise / compare
  auto_repair: False # If True, Ballast will attempt to repair any failed builds by deleting and re-installing the engine and/or model. If False, will skip/stop the pipeline on any failed build.
  sample_interval_ms: 100 # If sampled mode is used, specify how often Ballast should sample the model's output (in milliseconds)
  repeats: 1 # How many times to repeat each prompt for each model. Allows for standard deviation to be calculated.
  warmup: 1 # Specify the number of warmup iterations before each measurement occurs.
  prompts: [short, medium, long, very_long] # Specify which prompts to use for the benchmark. The prompt file names must match the names specified here. If set to 'auto', all files in the prompts/ directory will be used.
  thread_scaling: [1, 2, 4, 8] # Set the number of threads to use for thread scaling throughput measurements (e.g. [1, 2, 4, 8, 16]). If set to 'auto', will measure throughput for 1, 2, 4, 8, and 16 threads.
  thread_scaling_prompt_tokens: 512 # Length of synthetic prompt used for thread scaling measurement. Matches llama-bench's -p 512 default.
  parallel_builds: 1 # Specify how many engine builds to run in parallel. If set to 1, will build one engine/model at a time. If set to auto, will build as many as possible based on the number of CPU cores available.
  output_dir: results # Specify where Ballast should deposit output files. All outputs will be in the results/ folder by default.
  log_level: info # debug / info / error / warning

# What metrics do you want to measure?
# Model meta data (n_layer, type_k, model_size_bytes, etc.) and engine manifests are always recorded.
# Use 'all' to enable everything below. Will affect runtime.
metrics: 
  - all
  - -power_draw
